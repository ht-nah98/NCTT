<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hồ Sơ Thị Trường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   HỒ SƠ THỊ TRƯỜNG — giao diện SÁCH
   Cố ý KHÁC HẲN Bước 1–3: kia là bảng điều khiển dữ liệu (nền tối,
   chữ đơn cách), đây là ấn phẩm để đọc (nền giấy, chữ có chân).
   ═══════════════════════════════════════════════════════════════ */
:root{
 /* giấy & mực */
 --pp:#F7F4EE;--pp2:#FFFDF9;--pp3:#EFEAE0;--ink:#1A1815;--ink2:#413C35;
 --mut:#6E675C;--fnt:#9A9184;--rule:#DDD5C7;--rule2:#C6BCA9;
 /* accent: chàm + đồng */
 --ind:#2B4C7E;--ind2:#E8EEF6;--cop:#B07D3F;--cop2:#F6ECDC;
 --pos:#2E7D5B;--neg:#B03A38;--warn:#B07D3F;
 --shadow:0 1px 2px rgba(26,24,21,.05),0 8px 24px rgba(26,24,21,.07);
 /* ── BÍ DANH CHO THƯ VIỆN BIỂU ĐỒ ──
    chart.js viết cho Bước 1–3 (nền tối) nên gọi --ac/--cl/--hd/--ln/--ln2/--mt/--up.
    Ánh xạ sang hệ màu sách ở đây thay vì sửa từng lời gọi trong chart.js —
    một chỗ đổi, cả 10 biểu đồ đổi theo, và tự đúng khi chuyển theme. */
 --ac:var(--cop);--cl:var(--ind);--up:var(--pos);--dn:var(--neg);
 --hd:var(--pp3);--ln:var(--rule);--ln2:var(--rule2);--mt:var(--mut);--ft:var(--fnt);
 --disp:'Fraunces',Georgia,'Times New Roman',serif;
 --body:'Inter',system-ui,-apple-system,sans-serif;
 --mono:'JetBrains Mono',ui-monospace,monospace;
}
:root[data-theme="dark"]{
 --pp:#14120F;--pp2:#1B1815;--pp3:#221E1A;--ink:#F0EAE0;--ink2:#D6CEC2;
 --mut:#9C9488;--fnt:#6E675C;--rule:#2E2A25;--rule2:#453F37;
 --ind:#7FA8DC;--ind2:#17242F;--cop:#D9A55F;--cop2:#2A2118;
 --pos:#4FBF8B;--neg:#E0716E;--warn:#D9A55F;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --pp:#14120F;--pp2:#1B1815;--pp3:#221E1A;--ink:#F0EAE0;--ink2:#D6CEC2;
 --mut:#9C9488;--fnt:#6E675C;--rule:#2E2A25;--rule2:#453F37;
 --ind:#7FA8DC;--ind2:#17242F;--cop:#D9A55F;--cop2:#2A2118;
 --pos:#4FBF8B;--neg:#E0716E;--warn:#D9A55F;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 26px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--pp);color:var(--ink);font-family:var(--body);
 font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
 font-feature-settings:"kern" 1}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--ind)}
:focus-visible{outline:2px solid var(--ind);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ═══ CỔNG CHUYỂN — B3 sang B4 ═══ */
#gate{position:fixed;inset:0;z-index:200;background:var(--pp);
 display:flex;align-items:center;justify-content:center;flex-direction:column;
 gap:22px;animation:gateOut .95s cubic-bezier(.6,0,.2,1) .55s forwards}
#gate .gl{font-family:var(--mono);font-size:10px;letter-spacing:.4em;text-transform:uppercase;
 color:var(--fnt);animation:fadeUp .5s ease both}
#gate .gt{font-family:var(--disp);font-size:34px;font-weight:600;letter-spacing:-.02em;
 color:var(--ink);animation:fadeUp .5s ease .1s both;text-align:center;padding:0 22px}
#gate .gr{width:0;height:1px;background:var(--rule2);animation:ruleGrow .7s ease .2s forwards}
@keyframes gateOut{to{opacity:0;visibility:hidden}}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes ruleGrow{to{width:210px}}
.gate-done #gate{display:none}

/* ═══ KHUNG SÁCH ═══ */
.book{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
@media(max-width:940px){.book{grid-template-columns:1fr}}

/* ── MỤC LỤC ── */
.toc{border-right:1px solid var(--rule);background:var(--pp2);position:sticky;top:0;
 height:100vh;overflow-y:auto;padding:0 0 30px}
@media(max-width:940px){.toc{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:80;
 transform:translateX(-100%);transition:transform .28s ease;box-shadow:var(--shadow)}
 .toc.open{transform:none}}
.tochd{padding:22px 22px 15px;border-bottom:1px solid var(--rule)}
.tochd .kick{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;
 color:var(--cop);margin-bottom:7px}
.tochd .bt{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.22;
 letter-spacing:-.015em}
.tochd .bs{font-size:12px;color:var(--mut);margin-top:5px;font-family:var(--mono)}
.chap{padding:15px 0 3px}
.chn{font-family:var(--mono);font-size:8.5px;letter-spacing:.19em;text-transform:uppercase;
 color:var(--fnt);padding:0 22px 7px}
.pg{display:flex;align-items:baseline;gap:11px;padding:7px 22px;width:100%;text-align:left;
 border-left:2px solid transparent;line-height:1.4}
.pg:hover{background:var(--pp3)}
.pg[aria-current="true"]{border-left-color:var(--cop);background:var(--pp3)}
.pg .pn{font-family:var(--mono);font-size:10px;color:var(--fnt);flex:0 0 20px}
.pg[aria-current="true"] .pn{color:var(--cop)}
.pg .pt{flex:1;font-size:13.5px;color:var(--ink2)}
.pg[aria-current="true"] .pt{color:var(--ink);font-weight:600}
.tocft{margin-top:16px;padding:14px 22px 0;border-top:1px solid var(--rule)}
.tocft a{display:block;font-family:var(--mono);font-size:10.5px;color:var(--mut);
 text-decoration:none;padding:4px 0}
.tocft a:hover{color:var(--ind)}

/* nút mở mục lục trên di động */
.tocbtn{display:none;position:fixed;left:14px;bottom:16px;z-index:90;width:46px;height:46px;
 border-radius:50%;background:var(--ink);color:var(--pp);align-items:center;
 justify-content:center;font-size:17px;box-shadow:var(--shadow)}
@media(max-width:940px){.tocbtn{display:flex}}
.scrim{display:none;position:fixed;inset:0;background:rgba(26,24,21,.45);z-index:79}
.scrim.on{display:block}

/* ── VÙNG TRANG ── */
.stage{min-width:0;display:flex;flex-direction:column}
.page{max-width:760px;width:100%;margin:0 auto;padding:38px 40px 90px;flex:1}
@media(max-width:640px){.page{padding:26px 20px 80px}}
.page.turn{animation:turn .42s cubic-bezier(.22,.7,.3,1)}
@keyframes turn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── QUAY LẠI CÁC BƯỚC TRƯỚC ──
   Có ở MỌI trang, không bắt người đọc mở mục lục mới tìm được đường ra. */
.backnav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;
 border-bottom:1px solid var(--rule)}
.backnav a{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--mut);
 text-decoration:none;padding:3px 0;border-bottom:1px solid transparent}
.backnav a:hover{color:var(--ind);border-bottom-color:var(--ind)}
@media(max-width:560px){.backnav{gap:12px}.backnav a{font-size:10px}}

/* ── ĐẦU TRANG SÁCH ── */
.ph{margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--rule)}
.ph .ch2{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
 color:var(--cop);margin-bottom:9px;display:flex;align-items:center;gap:9px}
.ph h1{font-family:var(--disp);font-size:33px;font-weight:600;line-height:1.16;margin:0 0 11px;
 letter-spacing:-.025em}
@media(max-width:640px){.ph h1{font-size:26px}}
.ph .dek{font-size:16px;line-height:1.62;color:var(--mut);max-width:60ch}
.ph .dek b{color:var(--ink);font-weight:600}

/* ── HAI MẶT: KẾT LUẬN | GIẢI THÍCH ── */
.flip{display:flex;gap:0;border:1px solid var(--rule2);border-radius:3px;overflow:hidden;
 margin-bottom:24px;width:fit-content}
.flip button{padding:7px 17px;font-size:13px;color:var(--mut);background:var(--pp2);
 display:flex;align-items:center;gap:7px;white-space:nowrap}
.flip button+button{border-left:1px solid var(--rule2)}
.flip button[aria-pressed="true"]{background:var(--ink);color:var(--pp);font-weight:600}
.flip button .fi{font-size:11px;opacity:.8}
.face{display:none}
.face.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ── KẾT LUẬN: khối lớn ── */
.verd{background:var(--pp2);border:1px solid var(--rule2);border-radius:4px;padding:26px 28px;
 margin-bottom:22px;box-shadow:var(--shadow);position:relative}
.verd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
 background:var(--vc,var(--cop));border-radius:4px 0 0 4px}
.verd .vk{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--fnt);margin-bottom:11px}
.verd .vs{font-family:var(--disp);font-size:27px;font-weight:600;line-height:1.32;
 letter-spacing:-.02em;margin-bottom:13px}
@media(max-width:640px){.verd{padding:20px 20px}.verd .vs{font-size:22px}}
.verd .vb{font-size:15px;line-height:1.7;color:var(--ink2)}
.verd .vb b{color:var(--ink);font-weight:600}
.verd .vb p{margin:0 0 11px}.verd .vb p:last-child{margin:0}

/* con số nổi bật trong kết luận */
.figs{display:flex;gap:26px;flex-wrap:wrap;margin:18px 0 4px;padding-top:17px;
 border-top:1px solid var(--rule)}
.fig .fv{font-family:var(--mono);font-size:29px;font-weight:700;line-height:1;
 font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--fc,var(--ink))}
.fig .fl{font-size:11.5px;color:var(--mut);margin-top:5px;max-width:19ch;line-height:1.4}

/* ── VIỆC CẦN LÀM ── */
.act{background:var(--cop2);border:1px solid var(--cop);border-radius:4px;padding:16px 19px;
 margin:22px 0;display:flex;gap:14px}
.act .ai{font-family:var(--mono);font-size:15px;color:var(--cop);flex:0 0 auto;font-weight:700}
.act .ax{flex:1}
.act .al{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
 color:var(--cop);margin-bottom:6px}
.act .av{font-size:15px;line-height:1.62}
.act .av b{font-weight:600}
.act .am{font-family:var(--mono);font-size:11.5px;color:var(--mut);margin-top:8px;
 padding-top:8px;border-top:1px solid var(--cop);opacity:.9}

/* ── THÂN BÀI ── */
.body h2{font-family:var(--disp);font-size:21px;font-weight:600;margin:32px 0 10px;
 letter-spacing:-.015em;line-height:1.3}
.body h3{font-size:15px;font-weight:600;margin:24px 0 8px}
.body p{margin:0 0 14px;max-width:64ch}
.body p b{font-weight:600}
.body ul{margin:0 0 14px;padding-left:20px;max-width:62ch}
.body li{margin-bottom:6px}
.lead2{font-size:16px;line-height:1.68;color:var(--ink2);max-width:60ch}

/* hình + chú thích kiểu ấn phẩm */
.fg{margin:22px 0}
.fg .fgb{background:var(--pp2);border:1px solid var(--rule);border-radius:3px;padding:17px 19px}
.fg figcaption{font-size:12.5px;color:var(--mut);line-height:1.6;margin-top:10px;
 padding-left:13px;border-left:2px solid var(--rule2);max-width:62ch}
.fg figcaption b{color:var(--ink)}
.fg .fgn{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--fnt);margin-bottom:11px}
.ch{width:100%;height:auto;display:block;overflow:visible}
.cl-ax{font-family:var(--mono);font-size:10px;fill:var(--ink);font-weight:700}
.cl-sm{font-family:var(--mono);font-size:9.5px;fill:var(--mut)}
.cl-tn{font-family:var(--mono);font-size:8.5px;fill:var(--fnt)}
.cl-lb{font-family:var(--body);font-size:11px;fill:var(--ink)}

/* bảng kiểu ấn phẩm */
.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:16px 0}
.tb th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--fnt);font-weight:600;padding:9px 12px 9px 0;
 border-bottom:1px solid var(--rule2)}
.tb td{padding:11px 12px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top;
 line-height:1.55}
.tb tr:last-child td{border-bottom:0}
.tb .num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* trích dẫn nổi */
.pull{font-family:var(--disp);font-size:20px;line-height:1.45;color:var(--ink);
 border-left:3px solid var(--cop);padding:4px 0 4px 20px;margin:24px 0;max-width:54ch;
 font-weight:500;letter-spacing:-.012em}

/* thẻ nhỏ */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.chip{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:12px;
 background:var(--pp3);color:var(--mut);border:1px solid var(--rule)}
.chip.hot{background:var(--cop2);color:var(--cop);border-color:var(--cop);font-weight:600}
.chip.warn{background:var(--pp3);color:var(--neg);border-color:var(--neg)}
.lbx{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--fnt);margin:16px 0 6px}

/* khối cảnh báo */
.caution{background:var(--pp3);border:1px solid var(--rule2);border-left:3px solid var(--warn);
 border-radius:0 3px 3px 0;padding:15px 18px;margin:20px 0}
.caution .ct{font-size:14px;font-weight:600;color:var(--warn);margin-bottom:7px}
.caution .cd{font-size:13.5px;color:var(--mut);line-height:1.65}
.caution .cd b{color:var(--ink)}

/* nguồn cuối trang */
.srcs{margin-top:34px;padding-top:15px;border-top:1px solid var(--rule);
 font-family:var(--mono);font-size:10.5px;color:var(--fnt);line-height:1.9}
.srcs b{color:var(--mut)}

/* điều hướng trang trước/sau */
.turnnav{display:flex;gap:11px;margin-top:38px;padding-top:20px;border-top:1px solid var(--rule)}
.turnnav button{flex:1;text-align:left;padding:14px 17px;border:1px solid var(--rule2);
 border-radius:3px;background:var(--pp2)}
.turnnav button:hover{border-color:var(--cop);background:var(--pp3)}
.turnnav button:disabled{opacity:.35;cursor:default}
.turnnav .tk{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
 color:var(--fnt);margin-bottom:5px}
.turnnav .tv2{font-size:14px;font-weight:600;line-height:1.35}
.turnnav .nx{text-align:right}

/* mã prompt */
.prompt{background:var(--ind2);border:1px solid var(--ind);border-radius:3px;padding:15px 17px;
 margin:18px 0}
.prompt .pl2{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--ind);margin-bottom:9px;display:flex;align-items:center;gap:10px}
.prompt .cpx{margin-left:auto;font-family:var(--mono);font-size:10px;padding:4px 10px;
 border:1px solid var(--ind);border-radius:3px;color:var(--ind);letter-spacing:.05em}
.prompt .cpx:hover{background:var(--ind);color:var(--pp)}
.prompt code{display:block;font-family:var(--mono);font-size:12px;line-height:1.72;
 color:var(--ink);word-break:break-word}

/* thẻ chân dung / mô hình */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:18px 0}
@media(max-width:620px){.cards{grid-template-columns:1fr}}
.cd2{background:var(--pp2);border:1px solid var(--rule);border-radius:3px;padding:15px 17px}
.cd2.hot{border-color:var(--cop);background:var(--cop2)}
.cd2 .c1{font-family:var(--disp);font-size:16px;font-weight:600;margin-bottom:5px;line-height:1.3}
.cd2 .c2{font-size:12.5px;color:var(--mut);line-height:1.55;min-height:2.9em}
.cd2 .c3{margin-top:11px;padding-top:10px;border-top:1px solid var(--rule);
 display:flex;justify-content:space-between;gap:10px;font-size:12px}
.cd2 .c3 .num{font-family:var(--mono);font-weight:700;color:var(--ink)}
.cd2 .c4{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--cop);font-weight:700}

/* danh sách đánh số kiểu sách */
.numlist{counter-reset:nl;margin:18px 0}
.nli{display:flex;gap:15px;padding:14px 0;border-top:1px solid var(--rule)}
.nli:first-child{border-top:0;padding-top:0}
.nli .nn{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--cop);
 flex:0 0 26px;line-height:1.1}
.nli .nx2{flex:1;min-width:0}
.nli .nt{font-size:15px;font-weight:600;margin-bottom:5px;line-height:1.4}
.nli .nd{font-size:13.5px;color:var(--mut);line-height:1.62}
.nli .nm2{font-family:var(--mono);font-size:11px;color:var(--ind);margin-top:7px}

/* nhãn nhỏ */
.tag{font-family:var(--mono);font-size:8.5px;padding:2px 7px;border-radius:2px;
 letter-spacing:.08em;font-weight:700;text-transform:uppercase}
.tag.pos{background:var(--pp3);color:var(--pos)}
.tag.neg{background:var(--pp3);color:var(--neg)}
.tag.warn2{background:var(--pp3);color:var(--warn)}
.tag.ind{background:var(--ind2);color:var(--ind)}

/* tooltip */
#tt{position:fixed;z-index:150;max-width:330px;background:var(--ink);color:var(--pp);
 border-radius:4px;padding:12px 14px;font-size:13px;line-height:1.6;
 box-shadow:0 10px 30px rgba(26,24,21,.28);display:none;pointer-events:none}
#tt .k2{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;opacity:.65;
 margin-bottom:6px;display:flex;justify-content:space-between;gap:10px}
#tt .n3b{font-family:var(--disp);font-size:15px;font-weight:600;margin-bottom:5px}
#tt .d3{opacity:.88;font-size:12.5px}
.qm{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
 border-radius:50%;border:1px solid var(--rule2);color:var(--fnt);font-size:9px;
 font-family:var(--mono);cursor:help;vertical-align:2px;margin-left:6px;font-weight:700}
.qm:hover{border-color:var(--cop);color:var(--cop)}
</style>

</head>
<body>
<div id="gate">
 <div class="gl">Bước 3 → Bước 4</div>
 <div class="gt">Hồ sơ thị trường</div>
 <div class="gr"></div>
</div>
<div class="book">
 <nav class="toc" id="toc" aria-label="Mục lục"></nav>
 <main class="stage">
  <article class="page" id="page"></article>
 </main>
</div>
<button class="tocbtn" id="tocbtn" aria-label="Mở mục lục">☰</button>

/* ══════════════════════════════════════════════════════════════
   BIỂU ĐỒ — SVG thuần, không thư viện ngoài.

/* ── 1. RADAR — 5 trục điểm ──
   Đa giác đều 5 đỉnh. Bán kính mỗi đỉnh tỉ lệ điểm/5. */
function chRadar(axes,size=250){
 // Chừa 56px cho nhãn hai dòng (mã trục + điểm) — 40px cũ làm nhãn tràn khung.
 const R=size/2-56, cx=size/2, cy=size/2+6, n=axes.length;
 const ang=i=>(-Math.PI/2)+i*2*Math.PI/n;
 const pt=(i,r)=>[cx+Math.cos(ang(i))*r, cy+Math.sin(ang(i))*r];
 let g='';
 // lưới 5 vòng
 for(let lv=1;lv<=5;lv++){
  const r=R*lv/5;
  const p=axes.map((_,i)=>pt(i,r).map(v=>v.toFixed(1)).join(',')).join(' ');
  g+=`<polygon points="${p}" fill="none" stroke="var(--ln)" stroke-width="1"${
    lv===5?'':' stroke-dasharray="2 2"'}/>`;
 }
 // nan hoa + nhãn
 axes.forEach((a,i)=>{
  const [x,y]=pt(i,R);
  g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
    stroke="var(--ln)" stroke-width="1"/>`;
  const [lx,ly]=pt(i,R+20);
  const anch=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');
  g+=`<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" text-anchor="${anch}"
    class="cl-ax">${a.k}</text>`;
  g+=`<text x="${lx.toFixed(1)}" y="${(ly+14).toFixed(1)}" text-anchor="${anch}"
    class="cl-sm">${String(a.sc).replace('.',',')}</text>`;
 });
 // vùng điểm
 const pp=axes.map((a,i)=>pt(i,R*a.sc/5).map(v=>v.toFixed(1)).join(',')).join(' ');
 g+=`<polygon points="${pp}" fill="var(--ac)" fill-opacity=".16"
   stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>`;
 axes.forEach((a,i)=>{
  const [x,y]=pt(i,R*a.sc/5);
  g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="var(--ac)"/>`;
 });
 return `<svg viewBox="0 0 ${size} ${size+6}" class="ch" role="img"
   aria-label="Điểm 5 trục">${g}</svg>`;
}

/* ── 2. THANH XẾP CHỒNG — đường tới bậc trên ── */
function chLadder(score,tiers,pen,w=520){
 // Trên nền GIẤY: dùng viền + nền rất nhạt cho vùng bậc, và thanh điểm để MỞ
 // (viền đậm, ruột nhạt) — bản cũ tô đặc nên in ra thành một khối đen.
 const H=86, pad=10, max=20, sx=v=>pad+(w-pad*2)*v/max;
 const BY=26, BH=22;
 let g=`<rect x="${pad}" y="${BY}" width="${w-pad*2}" height="${BH}" rx="3"
   fill="var(--hd)" stroke="var(--ln2)" stroke-width="1"/>`;
 // vạch ngưỡng + nhãn bậc
 tiers.forEach(([v,nm])=>{ if(v<=0||v>=max)return;
  g+=`<line x1="${sx(v).toFixed(1)}" y1="${BY-4}" x2="${sx(v).toFixed(1)}" y2="${BY+BH+4}"
    stroke="var(--ln2)" stroke-width="1" stroke-dasharray="2 2"/>
   <text x="${sx(v).toFixed(1)}" y="${BY+BH+18}" text-anchor="middle" class="cl-sm">${v}</text>
   <text x="${sx(v).toFixed(1)}" y="${BY+BH+30}" text-anchor="middle" class="cl-tn">${nm}</text>`;
 });
 // phần gỡ được — vẽ TRƯỚC để thanh điểm nằm trên
 if(pen<0){
  const to=Math.min(max,score-pen);
  g+=`<rect x="${sx(score).toFixed(1)}" y="${BY}" width="${(sx(to)-sx(score)).toFixed(1)}"
    height="${BH}" fill="var(--up)" fill-opacity=".16" stroke="var(--up)"
    stroke-width="1.2" stroke-dasharray="4 3"/>
   <text x="${((sx(score)+sx(to))/2).toFixed(1)}" y="${BY-8}" text-anchor="middle"
    class="cl-sm" fill="var(--up)" style="font-weight:700">+${Math.abs(pen)} nếu gỡ phạt</text>`;
 }
 // điểm hiện tại: ruột nhạt + viền đậm, đọc được trên giấy
 g+=`<rect x="${pad}" y="${BY}" width="${(sx(score)-pad).toFixed(1)}" height="${BH}" rx="3"
   fill="var(--ac)" fill-opacity=".3" stroke="var(--ac)" stroke-width="1.2"/>
  <line x1="${sx(score).toFixed(1)}" y1="${BY-4}" x2="${sx(score).toFixed(1)}" y2="${BY+BH+4}"
   stroke="var(--ac)" stroke-width="2.5"/>
  <text x="${sx(score).toFixed(1)}" y="${BY-8}" text-anchor="${score>max*.7?'end':'middle'}"
   class="cl-sm" fill="var(--ac)" style="font-weight:700">${String(score).replace('.',',')}</text>`;
 return `<svg viewBox="0 0 ${w} ${H}" class="ch" role="img"
   aria-label="Đường tới bậc trên">${g}</svg>`;
}

/* ── 3. CỘT — phân bố tuổi ── */
function chCols(items,w=440,h=170,color='--cl'){
 const pad={l:34,r:10,t:14,b:34};
 const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
 const mx=Math.max(...items.map(i=>i.v))||1;
 const bw=iw/items.length;
 let g='';
 // lưới ngang
 [0,.5,1].forEach(f=>{
  const y=pad.t+ih*(1-f);
  g+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w-pad.r}" y2="${y.toFixed(1)}"
    stroke="var(--ln)" stroke-width="1"${f?' stroke-dasharray="2 2"':''}/>
   <text x="${pad.l-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" class="cl-sm">${
     Math.round(mx*f)}</text>`;
 });
 items.forEach((it,i)=>{
  const bh=ih*it.v/mx, x=pad.l+bw*i+bw*.16, bwid=bw*.68;
  const y=pad.t+ih-bh;
  g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bwid.toFixed(1)}"
    height="${Math.max(1,bh).toFixed(1)}" rx="2" fill="var(${it.hi?'--ac':color})"
    fill-opacity="${it.hi?'.34':'.2'}" stroke="var(${it.hi?'--ac':color})"
    stroke-width="${it.hi?1.4:1}"/>
   <text x="${(x+bwid/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle"
    class="cl-sm" fill="var(${it.hi?'--ac':'--mt'})">${it.v}</text>
   <text x="${(x+bwid/2).toFixed(1)}" y="${(h-pad.b+14).toFixed(1)}" text-anchor="middle"
    class="cl-tn">${it.k}</text>`;
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="Phân bố">${g}</svg>`;
}

/* ── 4. THANH NGANG — bối cảnh nghe ── */
function chBars(items,w=460,color='--cl'){
 // Nới cột nhãn và cột số: nhãn tiếng Việt dài hơn tiếng Anh, số có đơn vị đi kèm.
 const rh=25, pad={l:136,r:92,t:8,b:8};
 const h=pad.t+pad.b+rh*items.length;
 const iw=w-pad.l-pad.r;
 const mx=Math.max(...items.map(i=>i.v))||1;
 let g='';
 items.forEach((it,i)=>{
  const y=pad.t+rh*i, bw=iw*it.v/mx;
  g+=`<text x="${pad.l-10}" y="${(y+16).toFixed(1)}" text-anchor="end"
    class="cl-lb">${it.k}</text>
   <rect x="${pad.l}" y="${(y+5).toFixed(1)}" width="${iw}" height="14" rx="2"
    fill="var(--hd)"/>
   <rect x="${pad.l}" y="${(y+5).toFixed(1)}" width="${Math.max(2,bw).toFixed(1)}"
    height="14" rx="2" fill="var(${it.hi?'--ac':color})" fill-opacity="${it.hi?'.32':'.18'}"
    stroke="var(${it.hi?'--ac':color})" stroke-width="${it.hi?1.4:1}"/>
   <text x="${(pad.l+iw+8).toFixed(1)}" y="${(y+16).toFixed(1)}" class="cl-sm"
    fill="var(${it.hi?'--ac':'--mt'})">${it.lb}</text>`;
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="Bảng xếp hạng">${g}</svg>`;
}

/* ── 5. PHÂN TÁN — 16 chủ đề: % đang làm × hiệu quả ──
   Góc TRÁI TRÊN = ít người làm mà hiệu quả cao = cơ hội. */
function chScatter(pts,w=520,h=300){
 const pad={l:44,r:16,t:18,b:40};
 const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
 const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
 const xmx=Math.max(...xs)*1.08, ymx=Math.max(...ys)*1.1, ymn=Math.min(0.8,Math.min(...ys)*.95);
 const sx=v=>pad.l+iw*v/xmx, sy=v=>pad.t+ih*(1-(v-ymn)/(ymx-ymn));
 let g='';
 // vùng cơ hội: x thấp, y cao
 g+=`<rect x="${pad.l}" y="${pad.t}" width="${(iw*0.34).toFixed(1)}"
   height="${(ih*0.42).toFixed(1)}" fill="var(--up)" fill-opacity=".1"/>
  <text x="${(pad.l+7).toFixed(1)}" y="${(pad.t+14).toFixed(1)}" class="cl-tn"
   fill="var(--up)">ít người làm · hiệu quả cao</text>`;
 // trục
 g+=`<line x1="${pad.l}" y1="${(pad.t+ih).toFixed(1)}" x2="${w-pad.r}"
   y2="${(pad.t+ih).toFixed(1)}" stroke="var(--ln2)" stroke-width="1"/>
  <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${(pad.t+ih).toFixed(1)}"
   stroke="var(--ln2)" stroke-width="1"/>`;
 // mốc lift = 1 (không hơn không kém)
 if(ymn<1&&ymx>1){
  g+=`<line x1="${pad.l}" y1="${sy(1).toFixed(1)}" x2="${w-pad.r}" y2="${sy(1).toFixed(1)}"
    stroke="var(--mt)" stroke-width="1" stroke-dasharray="4 3"/>
   <text x="${w-pad.r-4}" y="${(sy(1)-5).toFixed(1)}" text-anchor="end" class="cl-tn">
   ngang mặt bằng (1,0×)</text>`;
 }
 // nhãn trục
 [0,.5,1].forEach(f=>{
  g+=`<text x="${sx(xmx*f).toFixed(1)}" y="${(pad.t+ih+16).toFixed(1)}"
    text-anchor="middle" class="cl-sm">${(xmx*f).toFixed(1).replace('.',',')}%</text>`;
  const yv=ymn+(ymx-ymn)*f;
  g+=`<text x="${pad.l-6}" y="${(sy(yv)+3.5).toFixed(1)}" text-anchor="end"
    class="cl-sm">${yv.toFixed(1).replace('.',',')}×</text>`;
 });
 g+=`<text x="${(pad.l+iw/2).toFixed(1)}" y="${h-6}" text-anchor="middle" class="cl-tn">
  phần trăm video đang làm chủ đề này</text>`;
 // điểm
 pts.forEach(p=>{
  const x=sx(p.x), y=sy(p.y);
  const c=p.rec?'--up':p.avoid?'--dn':'--cl';
  const r=p.rec||p.avoid?5.5:4;
  g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="var(${c})"
    fill-opacity="${p.rec||p.avoid?'.4':'.2'}" stroke="var(${c})"
    stroke-width="${p.rec||p.avoid?1.8:1.2}"/>`;
  if(p.lb) g+=`<text x="${(x+8).toFixed(1)}" y="${(y+3.5).toFixed(1)}" class="cl-tn"
    fill="var(${c})">${p.lb}</text>`;
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img"
   aria-label="Bản đồ chủ đề">${g}</svg>`;
}

/* ── 6. ĐỐI XỨNG — khoảng cách ngôn ngữ ──
   Trái: số lần khán giả viết · Phải: số tiêu đề dùng. */
function chDiverge(items,w=540){
 // Từ đặt ở CỘT RIÊNG giữa hai thanh, không đè lên thanh như bản trước.
 const rh=28, pad={t:26,b:8}, wordW=86, numW=52, ratW=48;
 const mid=w*0.42, lw=mid-numW-wordW/2-10, rw=w-mid-wordW/2-numW-ratW-16;
 const h=pad.t+pad.b+rh*items.length;
 const mxL=Math.max(...items.map(i=>i.l))||1;
 const mxR=Math.max(...items.map(i=>i.r))||1;
 const lEnd=mid-wordW/2-6;          // mép phải của vùng thanh trái
 const rStart=mid+wordW/2+6;        // mép trái của vùng thanh phải
 let g=`<text x="${(lEnd-lw/2).toFixed(1)}" y="13" text-anchor="middle" class="cl-tn"
   fill="var(--cl)">khán giả VIẾT</text>
  <text x="${(rStart+rw/2).toFixed(1)}" y="13" text-anchor="middle" class="cl-tn"
   fill="var(--ac)">tiêu đề DÙNG</text>
  <text x="${(w-6)}" y="13" text-anchor="end" class="cl-tn">chênh</text>`;
 items.forEach((it,i)=>{
  const y=pad.t+rh*i;
  const bl=Math.max(2,lw*it.l/mxL), br=Math.max(2,rw*it.r/mxR);
  g+=`<rect x="${(lEnd-bl).toFixed(1)}" y="${(y+5).toFixed(1)}" width="${bl.toFixed(1)}"
    height="15" rx="2" fill="var(--cl)" fill-opacity=".2" stroke="var(--cl)" stroke-width="1"/>
   <text x="${(lEnd-bl-6).toFixed(1)}" y="${(y+16.5).toFixed(1)}" text-anchor="end"
    class="cl-sm">${it.l.toLocaleString('de-DE')}</text>
   <text x="${mid.toFixed(1)}" y="${(y+16.5).toFixed(1)}" text-anchor="middle"
    class="cl-lb" style="font-weight:600">${it.w}</text>
   <rect x="${rStart.toFixed(1)}" y="${(y+5).toFixed(1)}" width="${br.toFixed(1)}"
    height="15" rx="2" fill="var(--ac)" fill-opacity=".3" stroke="var(--ac)" stroke-width="1.2"/>
   <text x="${(rStart+br+6).toFixed(1)}" y="${(y+16.5).toFixed(1)}" class="cl-sm">${it.r}</text>
   <text x="${(w-6)}" y="${(y+16.5).toFixed(1)}" text-anchor="end" class="cl-sm"
    fill="var(--ac)" style="font-weight:700">${Math.round(it.ratio)}×</text>`;
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img"
   aria-label="Khoảng cách ngôn ngữ">${g}</svg>`;
}

/* ── 7. VÒNG TRÒN TỈ LỆ — bố cục thumbnail ──
   Vẽ khung hình 16:9 với các vùng theo tỉ lệ diện tích đo được. */
function chFrame(t,w=300){
 const h=w*9/16;
 const pa=t.person_area_pct/100, ta=t.text_area_pct/100;
 // người: khối bên trái theo layout_split; chữ: dải ngang phía dưới
 const split=(t.layout_split||70)/100;
 const pw=w*split*0.62, ph=h*0.82, px=w*0.06, py=h*0.09;
 const th=h*ta*1.9, ty=h-th-h*0.07;
 let g=`<rect x="0" y="0" width="${w}" height="${h}" rx="4" fill="var(--hd)"
   stroke="var(--ln2)" stroke-width="1"/>`;
 g+=`<rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${pw.toFixed(1)}"
   height="${ph.toFixed(1)}" rx="3" fill="var(--cl)" fill-opacity=".14"
   stroke="var(--cl)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="${(px+pw/2).toFixed(1)}" y="${(py+ph/2-4).toFixed(1)}" text-anchor="middle"
   class="cl-lb" fill="var(--cl)">người</text>
  <text x="${(px+pw/2).toFixed(1)}" y="${(py+ph/2+11).toFixed(1)}" text-anchor="middle"
   class="cl-sm" fill="var(--cl)">${String(t.person_area_pct).replace('.',',')}% khung</text>`;
 g+=`<rect x="${(w*0.06).toFixed(1)}" y="${ty.toFixed(1)}" width="${(w*0.88).toFixed(1)}"
   height="${th.toFixed(1)}" rx="3" fill="var(--ac)" fill-opacity=".14"
   stroke="var(--ac)" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="${(w*0.5).toFixed(1)}" y="${(ty+th/2+4).toFixed(1)}" text-anchor="middle"
   class="cl-sm" fill="var(--ac)">chữ ${String(t.text_area_pct).replace('.',',')}% · ${
   t.text_lines} dòng</text>`;
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img"
   aria-label="Bố cục thumbnail">${g}</svg>`;
}

/* ── 8. DẢI MÀU — tỉ lệ màu chủ đạo thumbnail ── */
function chPalette(items,w=300){
 const h=44, tot=items.reduce((s,i)=>s+i.v,0)||1;
 let x=0,g='';
 items.forEach(it=>{
  const bw=w*it.v/tot;
  g+=`<rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="22" fill="${it.c}"/>`;
  if(bw>34) g+=`<text x="${(x+bw/2).toFixed(1)}" y="35" text-anchor="middle"
    class="cl-tn">${it.k}</text>
   <text x="${(x+bw/2).toFixed(1)}" y="15" text-anchor="middle" class="cl-tn"
    fill="${it.fg||'#fff'}">${String(it.v).replace('.',',')}%</text>`;
  x+=bw;
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="Dải màu">${g}</svg>`;
}

/* ── 9. THANH KHOẢNG — tham số có dải min–max và mục tiêu ── */
function chRange(items,w=460){
 const rh=34, pad={l:132,r:60,t:6,b:4};
 const h=pad.t+pad.b+rh*items.length;
 const iw=w-pad.l-pad.r;
 let g='';
 items.forEach((it,i)=>{
  const y=pad.t+rh*i;
  const lo=it.lo, hi=it.hi, tg=it.tg;
  const span=(hi-lo)||1;
  const fx=v=>pad.l+iw*(v-lo)/span;
  g+=`<text x="${pad.l-9}" y="${(y+16).toFixed(1)}" text-anchor="end" class="cl-lb">${it.k}</text>
   <line x1="${pad.l}" y1="${(y+13).toFixed(1)}" x2="${(pad.l+iw).toFixed(1)}"
    y2="${(y+13).toFixed(1)}" stroke="var(--ln2)" stroke-width="1"/>
   <rect x="${pad.l}" y="${(y+9).toFixed(1)}" width="${iw}" height="8" rx="4"
    fill="var(--cl)" fill-opacity=".14"/>
   <text x="${pad.l}" y="${(y+30).toFixed(1)}" class="cl-tn">${it.lot}</text>
   <text x="${(pad.l+iw).toFixed(1)}" y="${(y+30).toFixed(1)}" text-anchor="end"
    class="cl-tn">${it.hit}</text>`;
  if(tg!=null){
   const tx=fx(tg);
   g+=`<circle cx="${tx.toFixed(1)}" cy="${(y+13).toFixed(1)}" r="5" fill="var(--ac)"/>
    <text x="${(w-pad.r+7)}" y="${(y+17).toFixed(1)}" class="cl-sm"
     fill="var(--ac)" style="font-weight:700">${it.tgt}</text>`;
  }
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="Dải tham số">${g}</svg>`;
}

/* ── 10. CỘT NGANG XẾP HẠNG có nhãn phán quyết ── */
function chVerdict(items,w=470){
 // Nhãn tiếng Việt có ngoặc kép «» dài hơn hẳn — 150px cũ làm nhãn tràn trái 37px.
 const rh=27, pad={l:218,r:104,t:8,b:6};
 const CUT=30;   // cắt nhãn dài hơn mức này, thêm dấu …
 const h=pad.t+pad.b+rh*items.length;
 const iw=w-pad.l-pad.r;
 const mx=Math.max(...items.map(i=>i.v))||1;
 let g='';
 items.forEach((it,i)=>{
  const y=pad.t+rh*i, bw=Math.max(2,iw*it.v/mx);
  const c=it.ok?'--up':it.bad?'--dn':'--cl';
  const lb=it.k.length>CUT?it.k.slice(0,CUT-1)+'…':it.k;
  g+=`<text x="${pad.l-10}" y="${(y+16).toFixed(1)}" text-anchor="end" class="cl-lb">${lb}</text>
   <rect x="${pad.l}" y="${(y+5).toFixed(1)}" width="${iw}" height="14" rx="2" fill="var(--hd)"/>
   <rect x="${pad.l}" y="${(y+5).toFixed(1)}" width="${bw.toFixed(1)}" height="14" rx="2"
    fill="var(${c})" fill-opacity=".26" stroke="var(${c})" stroke-width="1.1"/>
   <text x="${(pad.l+iw+8).toFixed(1)}" y="${(y+16).toFixed(1)}" class="cl-sm">${it.lb}</text>
   <text x="${w-6}" y="${(y+16).toFixed(1)}" text-anchor="end" class="cl-tn"
    fill="var(${c})" style="font-weight:700">${it.vd||''}</text>`;
 });
 return `<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="Xếp hạng có phán quyết">${g}</svg>`;
}

{ch:'II · Khán giả',t:'Họ là ai',

    chVerdict([...P.pain].sort((a,b)=>b.lk-a.lk).slice(0,6).map(x=>{

{ch:'II · Khán giả',t:'Bao nhiêu tuổi, nghe lúc nào',

{ch:'IV · Công thức',t:'Hình ảnh — thumbnail',

   {k:'hổ phách',v:TH.amber_pct,c:'#B07D3F',fg:'#fff'},
   {k:'đơn sắc',v:TH.mono_pct,c:'#9A9184',fg:'#1a1a1a'},

    chữ <b>${dc(TH.text_area_pct,1)}%</b> trong <b>${TH.text_lines} dòng</b>.</p>

   ${act(`<b>Dựng một mẫu thumbnail theo tỉ lệ trên, dùng lại cho mọi video.</b>`,

  exp:`${fig('Hình 10 · Bố cục khung hình',
    `<div style="max-width:340px;margin:0 auto">${chFrame(TH)}</div>`,

     người một bên, chữ một bên, ít khi chồng lên nhau.`)}
   ${fig('Hình 11 · Màu chủ đạo',chPalette(pal,460),

{ch:'IV · Công thức',t:'Âm thanh — công thức nhạc',
 dek:'Dải tham số đo được, và prompt tiếng Anh nạp thẳng vào công cụ sinh nhạc.',
 f(){const MU=P.pb.music;
  const rng=[];
  if(MU.tempo_bpm) rng.push({k:'Nhịp độ (BPM)',lo:MU.tempo_bpm.range[0],hi:MU.tempo_bpm.range[1],
   tg:MU.tempo_bpm.target,lot:dc(MU.tempo_bpm.range[0],0),hit:dc(MU.tempo_bpm.range[1],0),
   tgt:dc(MU.tempo_bpm.target,0)});
  if(MU.harmonic_rhythm_sec) rng.push({k:'Đổi hợp âm (giây)',lo:MU.harmonic_rhythm_sec.range[0],
   hi:MU.harmonic_rhythm_sec.range[1],tg:MU.harmonic_rhythm_sec.target,
   lot:dc(MU.harmonic_rhythm_sec.range[0],1),hit:dc(MU.harmonic_rhythm_sec.range[1],1),
   tgt:dc(MU.harmonic_rhythm_sec.target,1)});
  if(MU.chord_vocabulary) rng.push({k:'Số hợp âm',lo:MU.chord_vocabulary.range[0],
   hi:MU.chord_vocabulary.range[1],tg:null,lot:dc(MU.chord_vocabulary.range[0],0),
   hit:dc(MU.chord_vocabulary.range[1],0),tgt:''});
  if(MU.section_dur_sec) rng.push({k:'Độ dài đoạn (giây)',lo:0,hi:60,tg:MU.section_dur_sec.target,
   lot:'0',hit:'60+',tgt:dc(MU.section_dur_sec.target,0)});
  return{
  sum:`<div class="verd" style="--vc:var(--ind)">
   <div class="vk">Công thức nhạc</div>
   <div class="vs">${dc(MU.tempo_bpm.target,0)} BPM, điệu trưởng, CÓ LỜI — bắt buộc.</div>
   <div class="vb"><p>${esc(MU.mode_ghi_chú||'')}</p>
   <p><b>Có lời là kết luận có bằng chứng</b>, không phải sở thích.
    Instrumental đã được chứng minh thất bại ở ngách này.</p></div>
   ${figs([{v:dc(MU.tempo_bpm.target,0),l:'BPM mục tiêu',c:'--ind'},
     {v:dc(MU.harmonic_rhythm_sec.target,1)+'s',l:'đổi hợp âm mỗi'},
     {v:dc(MU.section_dur_sec.target,0)+'s',l:'đổi không khí mỗi'}])}</div>
   <div class="prompt"><div class="pl2">Prompt nạp thẳng vào công cụ sinh nhạc
    <button class="cpx" id="cpmu">⧉ chép</button></div>
    <code id="mup">${esc(MU.prompt_en)}</code></div>
   ${act(`<b>Sinh 10 bản thử bằng prompt trên. Bắt buộc CÓ LỜI.</b>`,
    'view/ngày 10 bản đầu so với mặt bằng kênh')}`,
  exp:`${fig('Hình 12 · Dải tham số đo được',chRange(rng,560),
    `Chấm cam là giá trị mục tiêu, thanh là dải quan sát được trên
     ${MU.n_tracks_analyzed} track dẫn đầu.`)}
   <p>${esc(MU.prompt_ghi_chú||'')}</p>
   <div class="caution"><div class="ct">Cỡ mẫu chỉ ${MU.n_tracks_analyzed} track — và năm thứ chưa đo được</div>
    <div class="cd">${esc(MU.tầng||'')}<br><br>
     <b>Chưa đo được:</b></div>
    <div class="chips">${(MU.chưa_đo_được||[]).map(x=>
      `<span class="chip warn">${esc(x)}</span>`).join('')}</div></div>
   <p>Nghĩa là prompt trên mô tả đúng <b>nhịp và hoà âm</b>, nhưng
    <b>nhạc cụ, âm sắc, giọng hát</b> trong prompt là gợi ý chứ không phải kết quả đo.
    Đừng coi đó là công thức đã kiểm chứng.</p>
   ${srcs(['<b>Nguồn</b> '+esc(MU.nguồn||'04_outlier/audio/AUDIO_BRIEF.json'),
     '<b>Cỡ mẫu</b> '+MU.n_tracks_analyzed+' track — nhỏ, đọc kèm cảnh báo trên'])}`}
 }},

   ${srcs(['<b>Nguồn</b> _state/metrics.json → entry.top_efficiency'])}`}
 }},

{ch:'IV · Công thức',t:'Số này lấy ở đâu ra',
 dek:'Giả thuyết đã kiểm chứng, và những gì hồ sơ này chưa trả lời được.',
 f(){return{
  sum:`<div class="verd" style="--vc:var(--mut)">
   <div class="vk">Kiểm chứng</div>
   <div class="vs">${P.hyps.filter(h=>h.v==='ĐÚNG').length}/${P.hyps.length} giả thuyết đúng —
    và cái sai được ghi lại.</div>
   <div class="vb"><p>Một bản nghiên cứu chỉ toàn dự đoán đúng thường là dấu hiệu
    đã viết kết luận trước rồi mới đi tìm số liệu.</p></div></div>
   <table class="tb"><thead><tr><th style="width:14%">Kết quả</th><th>Giả thuyết</th>
    </tr></thead><tbody>
   ${P.hyps.map(h=>`<tr><td><span class="tag ${h.v==='ĐÚNG'?'pos':h.v==='SAI'?'neg':'warn2'}">${
     esc(h.v)}</span></td><td><b>${esc(h.h)}</b><br>
     <span style="color:var(--mut);font-size:12.5px">${esc(h.e)}</span></td></tr>`).join('')}
   </tbody></table>`,
  exp:`<h2>Toàn bộ dữ liệu gốc</h2>
   <table class="tb"><thead><tr><th>Nhóm</th><th>Chỉ số</th></tr></thead><tbody>
   ${Object.entries(P.mt).filter(([k,v])=>v&&Object.keys(v).length).map(([k,v])=>
    `<tr><td><b>${esc(k)}</b></td><td class="num">${Object.keys(v).length} chỉ số</td></tr>`).join('')}
   </tbody></table>
   <h2>Mốc chuẩn để tự so</h2>
   <table class="tb"><tbody>${Object.entries(P.bm).map(([k,v])=>
    `<tr><td>${esc(k.replace(/_/g,' '))}</td><td class="num">${
     Number.isInteger(v)||v>=1000?vn(Math.round(v)):dc(v,1)}</td></tr>`).join('')}</tbody></table>
   <div class="caution"><div class="ct">Hồ sơ này chưa trả lời được</div>
    <div class="cd"><b>RPM thật</b> — chỉ ước tính khoảng, YouTube không công khai.
     <b>Tỉ lệ xem hết video</b> — cần quyền truy cập Analytics của kênh.
     <b>Nhân quả</b> — mọi công thức đều là mô tả nhóm dẫn đầu, không phải bằng chứng
     làm thế sẽ thắng.</div></div>
   ${srcs(['<b>Nguồn</b> _state/scores.json · _state/metrics.json · 99_report/_synthesis.json',
     '<b>Chấm</b> '+P.at+' theo rubric v'+P.rubric,
     '<b>Không đưa lên</b> trích dẫn bình luận nguyên văn và tên tài khoản người dùng'])}`}
 }},
);

/* ══════════════════════════════════════════════════════════════
   BỘ KHUNG SÁCH — mục lục · chuyển trang · lật mặt kết luận/giải thích
   Địa chỉ trang lưu ở hash (#t3.giai-thich) nên chia sẻ được đúng trang.
   ══════════════════════════════════════════════════════════════ */
let PG=0;                 // trang đang mở
let FACE='sum';           // 'sum' = kết luận · 'exp' = giải thích
let TOCOPEN=false;

const CHAPS=[...new Set(PAGES.map(p=>p.ch))];
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
 .replace(/đ/g,'d').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');

/* ── MỤC LỤC ── */
function toc(){
 let h=`<div class="tochd">
  <div class="kick">Bước 4 · Hồ sơ</div>
  <div class="bt">${esc(P.niche)}</div>
  <div class="bs">${dc(P.score,2)}/${P.max} · ${esc(P.verdict)}</div></div>`;
 CHAPS.forEach(c=>{
  h+=`<div class="chap"><div class="chn">${esc(c)}</div>`;
  PAGES.forEach((p,i)=>{ if(p.ch!==c)return;
   h+=`<button class="pg" data-p="${i}" aria-current="${i===PG?'true':'false'}">
    <span class="pn">${String(i+1).padStart(2,'0')}</span>
    <span class="pt">${esc(p.t)}</span></button>`});
  h+=`</div>`;
 });
 h+=`<div class="tocft">
  <a href="chuan-hoa.html">← Bước 2 · Chuẩn hoá</a>
  <a href="data-tho.html">← Bước 1 · Dữ liệu thô</a>
  <a href="index.html">← Trang chủ</a></div>`;
 gid('toc').innerHTML=h;
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
  go(+b.dataset.p); closeToc()});
}
function closeToc(){TOCOPEN=false;gid('toc').className='toc';gid('scrim').className='scrim'}

/* ── DỰNG MỘT TRANG ── */
function render(){
 const p=PAGES[PG], d=p.f();
 gid('page').innerHTML=`
  <nav class="backnav" aria-label="Quay lại các bước trước">
   <a href="data-tho.html">← Bước 1 · Dữ liệu thô</a>
   <a href="chuan-hoa.html">← Bước 2 · Chuẩn hoá</a>
   <a href="index.html">← Trang chủ</a></nav>
  <header class="ph">
   <div class="ch2"><span>${esc(p.ch)}</span><span>·</span>
    <span>Trang ${String(PG+1).padStart(2,'0')} / ${PAGES.length}</span></div>
   <h1>${esc(p.t)}</h1>
   <div class="dek">${p.dek}</div></header>
  <div class="flip" role="group" aria-label="Chọn mặt trang">
   <button data-f="sum" aria-pressed="${FACE==='sum'}"><span class="fi">◆</span>Kết luận</button>
   <button data-f="exp" aria-pressed="${FACE==='exp'}"><span class="fi">▤</span>Giải thích</button></div>
  <div class="face${FACE==='sum'?' on':''}" id="fsum">${d.sum}</div>
  <div class="face${FACE==='exp'?' on':''} body" id="fexp">${d.exp}</div>
  <nav class="turnnav">
   <button ${PG===0?'disabled':''} data-go="${PG-1}">
    <div class="tk">← Trang trước</div>
    <div class="tv2">${PG>0?esc(PAGES[PG-1].t):'—'}</div></button>
   <button class="nx" ${PG===PAGES.length-1?'disabled':''} data-go="${PG+1}">
    <div class="tk">Trang sau →</div>
    <div class="tv2">${PG<PAGES.length-1?esc(PAGES[PG+1].t):'—'}</div></button></nav>`;
 gid('page').classList.remove('turn'); void gid('page').offsetWidth;
 gid('page').classList.add('turn');
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
  FACE=b.dataset.f; hash(); render()});
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
  const n=+b.dataset.go; if(n>=0&&n<PAGES.length) go(n)});
 document.querySelectorAll('[data-h]').forEach(el=>{
  el.onmouseenter=e=>showTT(e,el.dataset.h); el.onmouseleave=hideTT;
  el.onfocus=e=>showTT(e,el.dataset.h); el.onblur=hideTT});
 bindCopy();
 toc();
 scrollTo(0,0);
}
function go(n){ PG=Math.max(0,Math.min(PAGES.length-1,n)); hash(); render() }
function hash(){
 try{ history.replaceState(null,'','#'+slug(PAGES[PG].t)+(FACE==='exp'?'.giai-thich':'')) }catch(e){}
}
function fromHash(){
 const h=(location.hash||'').replace(/^#/,'');
 if(!h) return;
 const exp=h.endsWith('.giai-thich');
 const s=exp?h.slice(0,-11):h;
 const i=PAGES.findIndex(p=>slug(p.t)===s);
 if(i>=0){PG=i; FACE=exp?'exp':'sum'}
}

/* ── NÚT CHÉP ── */
function bindCopy(){
 const mu=gid('cpmu');
 if(mu) mu.onclick=()=>cp(P.pb.music.prompt_en,'Đã chép prompt nhạc');
 const id=gid('cpid');
 if(id) id.onclick=()=>cp(P.ideas.map(i=>`${i.n}. ${i.t}  [${i.b} · ${i.l}]`).join('\n'),
   `Đã chép ${P.ideas.length} tiêu đề`);
}
function cp(t,ok){
 if(navigator.clipboard&&navigator.clipboard.writeText)
  navigator.clipboard.writeText(t).then(()=>toast(ok),
   ()=>toast('Trình duyệt chặn chép — bôi đen rồi Ctrl+C'));
 else toast('Trình duyệt không hỗ trợ chép tự động');
}

/* ── TOOLTIP + TOAST ── */
const tt=gid('tt');
function showTT(e,k){
 const h=HELP[k]; if(!h)return;
 tt.innerHTML=`<div class="k2"><span>${k}</span><span>${h[2]}</span></div>
  <div class="n3b">${h[0]}</div><div class="d3">${h[1]}</div>`;
 tt.style.display='block';
 const r=e.target.getBoundingClientRect(), w=tt.offsetWidth||330, hh=tt.offsetHeight||120;
 let x=r.left, y=r.bottom+9;
 if(x+w>innerWidth-12)x=innerWidth-w-12;
 if(y+hh>innerHeight-12)y=r.top-hh-9;
 tt.style.left=Math.max(12,x)+'px'; tt.style.top=Math.max(12,y)+'px';
}
const hideTT=()=>tt.style.display='none';
function toast(m){
 let t=gid('toast');
 if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;bottom:22px;left:50%;transform:translateX(-50%);'+
   'background:var(--ink);color:var(--pp);border-radius:4px;padding:11px 18px;'+
   'font-size:13.5px;z-index:160;box-shadow:0 8px 26px rgba(26,24,21,.3)';
  document.body.appendChild(t)}
 t.textContent=m; t.style.display='block';
 clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',2600);
}

/* ── BÀN PHÍM: ← → lật trang, Tab đổi mặt ── */
addEventListener('keydown',e=>{
 if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
 if(e.key==='ArrowRight'){go(PG+1);e.preventDefault()}
 else if(e.key==='ArrowLeft'){go(PG-1);e.preventDefault()}
 else if(e.key==='e'||e.key==='E'){FACE=FACE==='sum'?'exp':'sum';hash();render()}
});
addEventListener('hashchange',()=>{const o=PG,of=FACE;fromHash();if(o!==PG||of!==FACE)render()});

/* ── KHỞI ĐỘNG ── */
fromHash();
render();
gid('tocbtn').onclick=()=>{TOCOPEN=!TOCOPEN;
 gid('toc').className='toc'+(TOCOPEN?' open':'');
 gid('scrim').className='scrim'+(TOCOPEN?' on':'')};
gid('scrim').onclick=closeToc;
/* cổng chuyển cảnh — bỏ khi xong hiệu ứng */
setTimeout(()=>document.documentElement.classList.add('gate-done'),1700);

</script>
</body>
</html>
